<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>中央目录证词台</title>
<style>
:root {
  --bg: #0f141b; --panel: #171f2a; --panel2: #1d2735;
  --ink: #e6edf3; --muted: #8b9bb0; --line: #2a3848;
  --accent: #57b8ff; --ok: #3fb950; --info: #58a6ff;
  --low: #d29922; --medium: #db8c2f; --high: #f0623d;
  --critical: #f85149;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei",
        "Segoe UI", sans-serif;
}
header {
  padding: 20px 28px; border-bottom: 1px solid var(--line);
  background: linear-gradient(180deg, #131b26, #0f141b);
}
header h1 { margin: 0; font-size: 22px; letter-spacing: 2px; }
header p { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
main { padding: 24px 28px 60px; max-width: 1280px; margin: 0 auto; }
.card {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 18px 20px; margin-bottom: 20px;
}
.card h2 { margin: 0 0 12px; font-size: 16px; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
button {
  background: var(--panel2); color: var(--ink); border: 1px solid var(--line);
  border-radius: 7px; padding: 8px 14px; cursor: pointer; font-size: 13px;
}
button:hover { border-color: var(--accent); }
button.primary { background: #16324c; border-color: #265a86; }
input[type=file] { color: var(--muted); }
.muted { color: var(--muted); font-size: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td {
  text-align: left; padding: 7px 9px; border-bottom: 1px solid var(--line);
  vertical-align: top;
}
th { color: var(--muted); font-weight: 600; }
tr:hover td { background: #1a2431; }
code, .mono {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 12px;
}
.pill {
  display: inline-block; padding: 1px 8px; border-radius: 999px;
  font-size: 11.5px; border: 1px solid var(--line); white-space: nowrap;
}
.pill.ok { color: var(--ok); border-color: #2c5e34; }
.pill.bad { color: var(--high); border-color: #6b3328; }
.pill.zip64 { color: #c084fc; border-color: #4c2f66; }
.pill.pref { color: #10151c; background: var(--accent); border-color: var(--accent); }
.sev-info { color: var(--info); }
.sev-low { color: var(--low); }
.sev-medium { color: var(--medium); }
.sev-high { color: var(--high); }
.sev-critical { color: var(--critical); font-weight: 700; }
.candidate { border-left: 3px solid var(--line); margin-bottom: 16px; }
.candidate.valid-preferred { border-left-color: var(--accent); }
.candidate.excluded { opacity: .72; }
.range { color: var(--muted); }
details { margin-top: 6px; }
summary { cursor: pointer; color: var(--accent); font-size: 12.5px; }
.finding { margin: 3px 0; }
.banner {
  border-radius: 8px; padding: 10px 14px; margin: 8px 0; font-size: 13px;
  border: 1px solid var(--line);
}
.banner.critical { background: #2a1518; border-color: #5d2428; }
.banner.high { background: #2a1d14; border-color: #5d3a24; }
.banner.info { background: #14202e; border-color: #26415c; }
#status { min-height: 18px; margin-top: 8px; color: var(--muted); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 24px; }
.tag { color: var(--muted); margin-right: 6px; }
.clickable { color: var(--accent); cursor: pointer; }
.crc-ok { color: var(--ok); }
.crc-mismatch { color: var(--high); font-weight: 700; }
.crc-skip { color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>中央目录证词台</h1>
  <p>不解压落盘的 ZIP 本地审阅：保留整包哈希、每个 EOCD 候选、中央目录与局部头的精确字节区间。
     多个候选目录全部并列保留，绝不只选“最后一个能打开的”。</p>
</header>
<main>
  <section class="card">
    <h2>导入归档</h2>
    <div class="row">
      <input type="file" id="file">
      <button class="primary" id="uploadBtn">审阅上传文件</button>
      <span class="muted">或导入内置样例：</span>
      <select id="fixtureSelect"></select>
      <button id="fixtureBtn">导入样例</button>
    </div>
    <div id="status"></div>
  </section>

  <section class="card" id="archiveListCard" hidden>
    <h2>已导入归档</h2>
    <table id="archiveTable">
      <thead><tr><th>ID</th><th>文件名</th><th>大小</th><th>SHA-256</th><th>导入时间</th></tr></thead>
      <tbody></tbody>
    </table>
  </section>

  <section id="report"></section>
</main>
<script src="/static/app.js"></script>
</body>
</html>
